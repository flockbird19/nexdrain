[project]
name = "nexdrain"
version = "0.1.0"
description = "NEXDRAIN: early-warning detection of toxic gas in sewage tanks"
readme = "README.md"
authors = [
    { name = "flockbird19", email = "vendev19@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
]

[project.scripts]
nexdrain = "nexdrain:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
